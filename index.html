<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #panorama { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    pannellum.viewer('panorama', {
        "autoLoad": true,
        "pitch": 0,
        "yaw": 0,
        "type": "equirectangular",
        "panorama": "https://pannellum.org/images/alma.jpg",
        "hotSpots": [
            {
                "pitch": 0,
                "yaw": 0,
                "type": "info",
                "text": "Go to Tour Page",
                "URL": "tour/" // এতে ক্লিক করলে tour ফোল্ডারের index.html পেজে নিয়ে যাবে
            }
        ]
    });

    // আপনি যদি হটস্পট ক্লিকে না গিয়ে ৩ সেকেন্ড পর স্বয়ংক্রিয়ভাবে tour ফোল্ডারে পাঠাতে চান, 
    // তবে নিচের ৩ লাইন আনকমেন্ট (Uncomment) করে দিতে পারেন:
    // setTimeout(function() {
    //     window.location.href = "tour/";
    // }, 3000);
</script>

</body>
</html>
