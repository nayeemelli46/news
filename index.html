<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Panorama Viewer</title>
    <!-- Pannellum CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #panorama {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
    // Root config.json লোড করার স্ক্রিপ্ট
    fetch('config.json')
        .then(response => response.json())
        .then(config => {
            pannellum.viewer('panorama', config);
        })
        .catch(error => {
            console.error('Config file load করতে সমস্যা হয়েছে:', error);
        });
</script>

</body>
</html>
